---
- name: Setup app-server (Debian 13 + Docker + FastAPI)
  hosts: app
  become: true
  vars:
    allowed_ip: "192.168.0.72"
    app_port: 8000

  tasks:
    # --- 1. Базовая настройка системы ---
    - name: Update apt cache and upgrade
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - python3-pip
        state: present

    # --- 2. Установка Docker (официальный репозиторий) ---
    - name: Add Docker GPG key
      ansible.builtin.shell: |
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
        chmod a+r /etc/apt/keyrings/docker.asc
      args:
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bookworm stable"
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is started
      ansible.builtin.service:
        name: docker
        state: started
        enabled: yes

    # --- 3. Файрвол (UFW) — только с твоего IP ---
    - name: Reset UFW to defaults
      community.general.ufw:
        state: reset

    - name: Set UFW default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow SSH from allowed IP
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp
        from_ip: "{{ allowed_ip }}"

    - name: Allow app port from allowed IP
      community.general.ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp
        from_ip: "{{ allowed_ip }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    # --- 4. Копируем файлы приложения ---
    - name: Create app directory
      ansible.builtin.file:
        path: /opt/app
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml
      ansible.builtin.copy:
        src: files/docker-compose.yml
        dest: /opt/app/docker-compose.yml

    - name: Copy init.sql
      ansible.builtin.copy:
        src: files/init.sql
        dest: /opt/app/init.sql

    - name: Copy application source
      ansible.builtin.copy:
        src: files/app/
        dest: /opt/app/app/
        mode: '0644'

    # --- 5. Запускаем Docker Compose ---
    - name: Build and start containers
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: /opt/app
      register: compose_result

    - name: Show compose status
      ansible.builtin.debug:
        var: compose_result.stdout_lines
